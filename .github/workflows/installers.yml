name: Installers

# Builds the Windows .msi and macOS .dmg with jpackage, through the
# installer-windows / installer-mac profiles in pom.xml (each activates by OS
# on its runner). The installers bundle a Java runtime, so users need no Java.
#
# Releases: bumping <version> in pom.xml and pushing to main builds the
# installers and publishes them as GitHub release v<version>. Pushing a version
# tag, or running the workflow by hand on main, does the same.
on:
  push:
    branches: [main]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A push to main only builds installers when pom.xml carries a version we have
  # not built before. Tags, pull requests and manual runs always build.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: check
        shell: bash
        run: |
          python3 - <<'PY'
          import os, subprocess, xml.etree.ElementTree as ET

          NS = {"m": "http://maven.apache.org/POM/4.0.0"}

          def version(text):
              return ET.fromstring(text).findtext("m:version", namespaces=NS)

          with open("pom.xml", "rb") as f:
              current = version(f.read())

          previous = None
          try:
              previous = version(subprocess.check_output(["git", "show", "HEAD^:pom.xml"]))
          except subprocess.CalledProcessError:
              pass  # first commit, or pom.xml is new

          ref = os.environ.get("GITHUB_REF", "")
          on_branch = os.environ["GITHUB_EVENT_NAME"] == "push" and not ref.startswith("refs/tags/")
          changed = (not on_branch) or current != previous

          print(f"pom version {current} (previous commit: {previous}) -> build={changed}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={current}\n")
              out.write(f"changed={str(changed).lower()}\n")
          PY

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit tests
        run: mvn -B test

  windows:
    needs: [version, test]
    if: needs.version.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # jpackage builds an MSI through WiX 3; the runner image does not always
      # carry it, and jpackage finds it on PATH.
      - name: Ensure WiX 3 is on PATH
        shell: pwsh
        run: |
          $bin = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v3*\bin\candle.exe' -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $bin) {
            choco install wixtoolset --version 3.14.1 --no-progress -y
            $bin = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v3*\bin\candle.exe' -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          }
          if (-not $bin) { throw 'WiX 3 not found after install' }
          Add-Content -Path $env:GITHUB_PATH -Value $bin.DirectoryName

      - name: Build installer
        run: mvn -B -Pinstaller-windows clean verify

      - uses: actions/upload-artifact@v4
        with:
          name: sudfixer-${{ needs.version.outputs.version }}-windows-msi
          path: target/installer/*.msi
          if-no-files-found: error


  macos:
    needs: [version, test]
    if: needs.version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon and Intel builds: jpackage bundles the runner's own JDK
          # and JavaFX natives, so each architecture needs its own runner.
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build installer
        run: mvn -B -Pinstaller-mac clean verify

      - name: Name the DMG by architecture
        shell: bash
        run: |
          cd target/installer
          for f in *.dmg; do mv "$f" "${f%.dmg}-${{ matrix.arch }}.dmg"; done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: sudfixer-${{ needs.version.outputs.version }}-macos-${{ matrix.arch }}-dmg
          path: target/installer/*.dmg
          if-no-files-found: error

  # One job publishes the release once every installer is built, so the
  # Windows and macOS jobs never race to create it.
  release:
    needs: [version, windows, macos]
    if: >-
      needs.version.outputs.changed == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          ls -la dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG exists; replacing its installers"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "SUD Time Fixer $VERSION" --generate-notes
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
